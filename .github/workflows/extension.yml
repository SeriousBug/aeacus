name: Extension

on:
  push:
    branches: [main]
    paths: ["extension/**", "shared/**"]
  pull_request:
    paths: ["extension/**", "shared/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Types and lint before the build: they are the quickest way to hear about a name used before
      # its own line, or a message field that only one side spells that way.
      - run: pnpm check
      # The build comes next: the tests read what it wrote, and check that every file each manifest
      # names is there. The model tests need the weights beside the repo, so they skip here.
      - run: pnpm build
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            extension/dist/chrome
            extension/dist/firefox
            extension/dist/safari
