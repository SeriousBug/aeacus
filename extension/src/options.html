<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aeacus</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <section class="card">
      <label class="row">
        <span>
          <strong>Theme</strong>
          <em>Light, dark, or whatever your computer is set to.</em>
        </span>
        <select id="theme">
          <option value="system">Follow the system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="row">
        <input type="checkbox" id="gpu">
        <span>
          <strong>Allow GPU acceleration</strong>
          <em>When enabled, Aeacus will use your GPU to speed up processing if one is available. When
            disabled, the processing will be done on CPU only. Recommended: on.</em>
        </span>
      </label>
      <label class="row">
        <input type="checkbox" id="verbose">
        <span>
          <strong>Enable verbose debug logs</strong>
          <em>Log each span Aeacus evaluated in browser console. Only for development purposes.</em>
        </span>
      </label>
    </section>

    <section class="card">
      <h2>Download Aeacus</h2>
      <p>Aeacus S 1 will be downloaded from
        <a href="https://huggingface.co/level20tauren/aeacus-s-1" target="_blank" rel="noreferrer">Hugging Face</a>. This only needs to
        be done once. 90 MB will be downloaded.</p>
      <div class="actions">
        <button id="download" type="button">Download</button>
      </div>
      <p id="progress" class="note" hidden></p>
    </section>

    <footer>
      <a href="https://aeacus.bgenc.dev" target="_blank" rel="noreferrer">aeacus.bgenc.dev</a>
      <a href="https://github.com/SeriousBug/aeacus" target="_blank" rel="noreferrer">Source</a>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
