<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aeacus settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Aeacus AI Judge</p>
      <h1>Settings</h1>
    </header>

    <section class="card">
      <label class="row">
        <input type="checkbox" id="auto">
        <span>
          <strong>Check pages as they open</strong>
          <em>Once Aeacus is on this computer, pages are checked without being asked.</em>
        </span>
      </label>

      <label class="row">
        <input type="checkbox" id="tooltips">
        <span>
          <strong>Say what Aeacus thinks when I point at text</strong>
          <em>Hovering over a highlighted word shows how sure Aeacus is about it.</em>
        </span>
      </label>

      <label class="row field">
        <span>
          <strong>Shortest paragraph to check</strong>
          <em>Aeacus was trained on passages of at least 30 words, so paragraphs shorter than this are
            left unmarked.</em>
        </span>
        <input type="number" id="minWords" min="10" max="200" step="5">
      </label>
    </section>

    <section class="card">
      <h2>Aeacus on this computer</h2>
      <p id="model-status">Aeacus is downloaded the first time you check a page.</p>
      <div class="actions">
        <button id="download" type="button">Download Aeacus now</button>
      </div>
    </section>

    <footer>
      <a href="https://aeacus.bgenc.dev">aeacus.bgenc.dev</a>
      <a href="https://huggingface.co/level20tauren/aeacus-s-1">The model</a>
      <a href="https://github.com/SeriousBug/aeacus">Source</a>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>
