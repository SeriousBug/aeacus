<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aeacus extension perf</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { run } from "./perf.js";

const out = document.getElementById("out");
const lines = [];

function show(text) {
  lines.push(text);
  out.textContent = lines.join("\n\n");
}

function errors(error) {
  return String(error?.stack ?? error);
}

const which = new URLSearchParams(location.search).get("only");

if (!which || which === "page") {
  try {
    show(JSON.stringify(await run("page"), null, 2));
  } catch (e) {
    show(`page failed: ${errors(e)}`);
  }
}

if (!which || which === "worker") {
  try {
    const results = await new Promise((resolve, reject) => {
      const worker = new Worker(new URL(`worker.js${location.search}`, location.href), { type: "module" });
      worker.onmessage = ({ data }) => resolve(data);
      worker.onerror = (e) => reject(e.message ?? e);
    });
    show(JSON.stringify(results, null, 2));
  } catch (e) {
    show(`worker failed: ${errors(e)}`);
  }
}

if (!which || which === "sw") {
  try {
    await navigator.serviceWorker.register(new URL("sw.js", location.href), { type: "module" });
    await navigator.serviceWorker.ready;
    const registration = (await navigator.serviceWorker.getRegistration()).waiting
      ?? (await navigator.serviceWorker.getRegistration()).active;
    const results = await new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      channel.port1.onmessage = ({ data }) => resolve(data);
      setTimeout(() => reject(new Error("service worker timed out")), 600000);
      registration.postMessage({ go: true }, [channel.port2]);
    });
    show(JSON.stringify(results, null, 2));
  } catch (e) {
    show(`service worker failed: ${errors(e)}`);
  }
}

document.documentElement.dataset.done = "1";
</script>
</body>
</html>
