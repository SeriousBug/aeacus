<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aeacus extension perf</title>
<style>
  body { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 24px; color: #0f172a; }
  pre { margin: 0; }
  .head { font-weight: 600; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="head" id="head">running…</div>
<pre id="out"></pre>
<script type="module">
// Every setting runs in a worker of its own, because ONNX Runtime reads its env once per context and
// a second variant in the same one would silently reuse the first one's engine and thread pool.
const query = new URLSearchParams(location.search);
const PROVIDERS = (query.get("providers") ?? "webgpu,wasm").split(",").filter(Boolean);
const THREADS = (query.get("threads") ?? "1,8").split(",").map(Number).filter(Boolean);

const out = document.getElementById("out");
const rows = [];

const pad = (text, width, right = false) => {
  const value = String(text);
  return right ? value.padStart(width) : value.padEnd(width);
};

function draw() {
  const columns = [
    ["engine", 10], ["threads", 9], ["used", 10], ["load", 10], ["run", 10], ["tok/s", 8],
  ];
  const line = columns.map(([name, width], at) => pad(name, width, at > 1)).join("  ");
  const body = rows.map((row) => [
    pad(row.asked, 10), pad(row.threadsWanted, 9, true), pad(row.provider ?? "-", 10),
    pad(row.loadMs === undefined ? "-" : `${row.loadMs} ms`, 10, true),
    pad(row.runsMs ? `${Math.min(...row.runsMs)} ms` : "-", 10, true),
    pad(row.tokensPerSecond === undefined ? "-" : row.tokensPerSecond, 8, true),
  ].join("  "));
  const notes = rows.filter((row) => row.webgpuError || row.sessionError)
    .map((row) => `${row.asked}: ${row.webgpuError ?? row.sessionError}`);
  const best = rows.filter((row) => row.tokensPerSecond).sort((a, b) => b.tokensPerSecond - a.tokensPerSecond)[0];
  out.textContent = [line, "-".repeat(line.length), ...body, "",
    notes.length ? `errors:\n${notes.join("\n")}\n` : "",
    best ? `fastest: ${best.asked}, ${best.threadsWanted} threads, ${best.tokensPerSecond} tok/s` : "",
  ].join("\n");
}

function timeOne(provider, threads) {
  return new Promise((resolve) => {
    const url = `worker.js?provider=${provider}&threads=${threads}`;
    const worker = new Worker(url, { type: "module" });
    worker.onmessage = ({ data }) => { worker.terminate(); resolve(data); };
    worker.onerror = (event) => {
      worker.terminate();
      resolve({ asked: provider, threadsWanted: threads, sessionError: String(event.message ?? event) });
    };
  });
}

const first = await timeOne(PROVIDERS[0], THREADS[0]);
document.getElementById("head").textContent =
  `512-token window, dedicated worker, crossOriginIsolated=${first.crossOriginIsolated},`
  + ` SharedArrayBuffer=${first.sharedArrayBuffer}, hasGpu=${first.hasGpu}`;

for (const provider of PROVIDERS) {
  for (const threads of THREADS) {
    const row = provider === PROVIDERS[0] && threads === THREADS[0]
      ? first
      : await timeOne(provider, threads);
    rows.push(row);
    draw();
  }
}

document.documentElement.dataset.done = "1";
</script>
</body>
</html>
